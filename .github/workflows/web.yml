name: Web Checks

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bunfig.toml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bunfig.toml"

jobs:
  web-checks:
    name: Web Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck web app
        run: bun run --cwd apps/web typecheck

      - name: Lint web app
        run: bun run --cwd apps/web lint

      - name: Unit tests
        run: bun run --cwd apps/web test

      - name: Build web app
        run: bun run build:web

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke
        run: bun run --cwd apps/web e2e:smoke
