name: Bug report
description: Report a reproducible problem in the Web UI or local API.
title: "[Bug]: "
labels: ["Type: Bug"]
body:
  - type: markdown
    attributes:
      value: |
        This fork supports the Web UI and local API only. Search existing issues before filing a new report.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I reproduced this on the latest commit from this repository.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
  - type: input
    attributes:
      label: Commit
      description: The commit SHA or date of the checkout you tested.
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and operating system
      placeholder: Firefox 141 on macOS 15.6
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Explain the problem and attach screenshots when useful.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Include relevant browser-console or API logs after removing private paths and tokens.
