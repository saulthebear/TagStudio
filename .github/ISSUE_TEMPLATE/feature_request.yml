name: Feature request
description: Suggest an improvement to the Web UI, local API, or core library.
title: "[Feature]: "
labels: ["Type: Enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This fork is web-first. Native Qt UI and packaged desktop releases are out of scope.
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This request fits the Web UI or local API scope.
          required: true
  - type: textarea
    attributes:
      label: Use case
      description: Describe the problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Note any workarounds or alternative designs you considered.
