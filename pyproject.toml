[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TagStudio"
description = "A local-first web interface for organizing and tagging files."
version = "9.5.6"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chardet~=5.2",
    "fastapi~=0.116",
    "humanfriendly==10.*",
    "opencv_python~=4.11",
    "Pillow>=10.2,<12",
    "pillow-heif~=0.22",
    "pillow-jxl-plugin~=1.3",
    "pydantic~=2.10",
    "pydub~=0.25",
    "Send2Trash~=1.8",
    "SQLAlchemy~=2.0",
    "structlog~=25.3",
    "toml~=0.10",
    "typing_extensions~=4.13",
    "ujson~=5.10",
    "uvicorn~=0.35",
    "wcmatch==10.*",
    "requests~=2.31.0",
    "semver~=3.0.4",
]

[project.optional-dependencies]
dev = ["tagstudio[mypy,pre-commit,pytest,ruff]"]
mypy = ["mypy==1.15.0", "mypy-extensions==1.*", "types-ujson~=5.10"]
pre-commit = ["pre-commit~=4.2"]
pytest = [
    "httpx~=0.28",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
]
ruff = ["ruff==0.11.8"]

[project.scripts]
tagstudio-api = "tagstudio.api.main:main"
tagstudio-api-openapi = "tagstudio.api.openapi:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tagstudio"]

[tool.mypy]
mypy_path = ["src/tagstudio"]
disable_error_code = [
    "annotation-unchecked",
    "func-returns-value",
    "import-untyped",
]
explicit_package_bases = true
ignore_missing_imports = true
implicit_optional = true
strict_optional = false
warn_unused_ignores = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = "tagstudio.core.ts_core"
ignore_errors = true

[tool.pyright]
ignore = [
    ".venv/**",
]
include = ["src/tagstudio", "tests"]
reportAny = false
reportIgnoreCommentWithoutRule = false
reportImplicitStringConcatenation = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
# reportOptionalMemberAccess = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnusedCallResult = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "D", "E", "F", "FBT003", "I", "N", "SIM", "T20", "UP"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E402"]
[tool.ruff.lint.pydocstyle]
convention = "google"
